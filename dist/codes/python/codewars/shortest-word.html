    <p>Donner la longueur du mot le plus court d’une phrase.</p>
    <h2>Code Python</h2>
    <pre class="python-source" tabindex="0" aria-label="Code Python"><code id="python-source">find_short=lambda s:min(map(len,s.split()))</code></pre>
